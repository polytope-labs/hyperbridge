[package]
name = "tesseract-prover"
version = "2.1.3"
edition = "2021"
description = "Standalone BEEFY consensus prover daemon"
authors = ["Polytope Labs <hello@polytope.technology>"]

[[bin]]
name = "tesseract-prover"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.75"
toml = "0.7.4"
clap = { version = "4.3.5", features = ["derive"] }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
rustls = { version = "0.23.23", features = ["ring"] }
primitive-types = { workspace = true }
subxt-utils = { workspace = true }

tesseract-beefy = { workspace = true, default-features = false }
tesseract-substrate = { workspace = true }
tesseract-primitives = { workspace = true }

zk-beefy = { path = "../consensus/beefy/zk", default-features = false }

[features]
default = ["sp1-local"]
sp1-local = ["tesseract-beefy/sp1-local", "zk-beefy/local"]
sp1-cluster = ["tesseract-beefy/sp1-cluster", "zk-beefy/cluster"]
# Compile the apk circuit into this binary rather than talking to a prover process.
local = ["tesseract-beefy/local"]
