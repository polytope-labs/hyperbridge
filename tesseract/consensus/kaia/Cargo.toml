[package]
name = "tesseract-kaia"
version = "0.1.0"
edition = "2021"
description = "Kaia consensus relayer for tesseract"
authors = ["Polytope Labs <hello@polytope.technology>"]

[dependencies]
anyhow = { workspace = true, default-features = true }
async-trait = "0.1.88"
codec = { package = "parity-scale-codec", version = "3.2.2", features = ["derive"] }
ismp = { workspace = true, default-features = true }
ismp-kaia = { workspace = true, default-features = true }
kaia-verifier = { workspace = true, default-features = true }
kaia-prover = { workspace = true }
log = { workspace = true, default-features = true }
primitive-types = { workspace = true, default-features = true }
serde = { version = "1.0", features = ["derive"] }
tesseract-evm = { workspace = true }
tesseract-primitives = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dependencies.polkadot-sdk]
workspace = true
features = ["sp-core", "sp-io", "std"]

[dev-dependencies]
hex = { version = "0.4.3" }
