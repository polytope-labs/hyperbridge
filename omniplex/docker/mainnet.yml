# Omniplex for mainnet: one process per chain, Postgres, and omnihedron serving the tables.
#
#   docker compose -f omniplex/docker/mainnet.yml up -d
#
# `omniplex/docker/.env.omniplex` (or `OMNIPLEX_ENV_FILE`) holds each chain's RPC URLs, named
# after the chain (`ethereum-mainnet` reads `ETHEREUM_MAINNET`), and `<CHAIN>_SUBSTRATE` for a
# Substrate chain. See
# docs/ai/changelog/2026-11-03-rindexer-indexer.md for every variable.

x-omniplex: &omniplex
  image: ${OMNIPLEX_IMAGE:-polytopelabs/omniplex:latest}
  # A process exits cleanly only when `INDEXER_END_BLOCKS` stops its chain, which must not loop.
  restart: on-failure
  env_file: ${OMNIPLEX_ENV_FILE:-.env.omniplex}
  environment: &omniplex-env
    INDEXER_CONFIG: /omniplex/config/mainnet.toml
    DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASS:-postgres}@postgres:5432/${DB_DATABASE:-omniplex}
  volumes:
    - omniplex-run:/omniplex/run
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-omniplex}
    ports:
      - 127.0.0.1:${DB_PORT:-5432}:5432
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  omnihedron:
    image: ${OMNIHEDRON_IMAGE:-polytopelabs/omnihedron:latest}
    restart: unless-stopped
    command: ["--name=app", "--playground"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      DB_DATABASE: ${DB_DATABASE:-omniplex}
      OMNIHEDRON_PORT: 3000
    ports:
      - 127.0.0.1:${GRAPHQL_PORT:-3000}:3000
    healthcheck:
      # The image has bash but no curl or wget.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3000 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  omniplex-hyperbridge-nexus:
    <<: *omniplex
    environment:
      <<: *omniplex-env
      INDEXER_CHAINS: hyperbridge-nexus

  omniplex-ethereum-mainnet:
    <<: *omniplex
    environment:
      <<: *omniplex-env
      INDEXER_CHAINS: ethereum-mainnet

  omniplex-arbitrum-mainnet:
    <<: *omniplex
    environment:
      <<: *omniplex-env
      INDEXER_CHAINS: arbitrum-mainnet

  omniplex-base-mainnet:
    <<: *omniplex
    environment:
      <<: *omniplex-env
      INDEXER_CHAINS: base-mainnet

  omniplex-bsc-mainnet:
    <<: *omniplex
    environment:
      <<: *omniplex-env
      INDEXER_CHAINS: bsc-mainnet

  omniplex-polygon-mainnet:
    <<: *omniplex
    environment:
      <<: *omniplex-env
      INDEXER_CHAINS: polygon-mainnet

  omniplex-polkadot-hub-mainnet:
    <<: *omniplex
    environment:
      <<: *omniplex-env
      INDEXER_CHAINS: polkadot-hub-mainnet

volumes:
  postgres:
  omniplex-run:
