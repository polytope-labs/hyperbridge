[package]
name = "beefy-verifier"
version = "0.1.0"
edition = "2024"
authors = ["Polytope Labs <hello@polytope.technology>"]
description = "Verifier for the BEEFY consensus client"
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
log = { workspace = true }
anyhow = { workspace = true, default-features = false }
primitive-types = { workspace = true, default-features = false, features = ["codec"] }
codec = { workspace = true, features = ["derive"], default-features = false }
beefy-verifier-primitives = { workspace = true, default-features = false }
ismp = { workspace = true, default-features = false }
merkle-mountain-range = { workspace = true, default-features = false }
rs_merkle = { workspace = true, default-features = false }
thiserror = { workspace = true }
sp1-verifier = { git = "https://github.com/polytope-labs/sp1.git", branch = "polytope-labs/v6.1.0-wasm-compatible", default-features = false }
alloy-sol-types = { workspace = true, default-features = false }

sha2 = { version = "0.10", default-features = false, optional = true }
ark-bls12-381 = { version = "0.5", default-features = false, features = ["curve"], optional = true }
ark-ec = { version = "0.5", default-features = false, optional = true }
ark-ff = { version = "0.5", default-features = false, optional = true }
ark-serialize = { version = "0.5", default-features = false, optional = true }

[dependencies.gnark-plonk-verifier]
git = "https://github.com/polytope-labs/gnark-apk-proofs"
rev = "48e6aa504994a58fb41465e22eb90b1df6a190f8"
default-features = false
optional = true

[dependencies.polkadot-sdk]
workspace = true
features = [
    "sp-consensus-beefy",
    "sp-core",
    "sp-mmr-primitives",
    "sp-runtime"
]

[dev-dependencies]
hex-literal = { workspace = true }
hex = { workspace = true, default-features = true }
beefy-prover = { workspace = true }
ismp-abi = { workspace = true, default-features = true }
# The APK fixture is built in two halves: this crate collects the live BEEFY data, the SNARK is
# generated by `gnark-apk-proofs` out of tree, and the two meet over a json file.
json = { workspace = true, default-features = true }
apk-commitment = { workspace = true, default-features = true }
alloy-primitives = { workspace = true, default-features = true }
subxt = { workspace = true, default-features = true }
subxt-core = { workspace = true, default-features = true }
subxt-utils = { workspace = true, default-features = true }
futures = { workspace = true }
tokio = { workspace = true }
# Pinned to the versions w3f-bls builds against, so the hash-to-curve test vector is generated by
# exactly the code path that signs on the relay chain.
ark-bls12-381 = { version = "0.4.0", features = ["curve"], default-features = false }
ark-ec = { version = "0.4.0", default-features = false }
ark-ff = { version = "0.4.0", default-features = false }
ark-serialize = { version = "0.4.0", default-features = false }
sha2 = { version = "0.10", default-features = false }
# Aggregate BLS verification prototype (Option B): the same double-scheme BLS as substrate BEEFY.
w3f-bls = { version = "0.1.9", default-features = true }

[dev-dependencies.polkadot-sdk]
workspace = true
default-features = true
features = ["sp-io"]


[features]
default = ["std"]
# Tests that need `w3f-bls` itself: the hash-to-curve vector and the aggregate checks the APK path
# is built on. Nothing in the library depends on it.
bls-crypto = []
apk = [
    "dep:gnark-plonk-verifier",
    "dep:sha2",
    "dep:ark-bls12-381",
    "dep:ark-ec",
    "dep:ark-ff",
    "dep:ark-serialize",
]
# Runs the BLS-BEEFY tests against a relay whose BEEFY authorities are paired ecdsa_bls_crypto
# keys. Pulls the prover's `bls` decode path, which reads 177-byte paired signatures and keys.
bls = ["beefy-prover/bls", "beefy-prover/bls-aggregate", "bls-crypto"]
# Storage keys for a relay that names its beefy-mmr pallet `MmrLeaf` rather than `BeefyMmrLeaf`.
# Westend (and Polkadot/Kusama) use `BeefyMmrLeaf`, so leave this off for them; our rococo fork
# used `MmrLeaf`, so pair it with `bls` as `--features bls,local` when testing against that chain.
local = ["beefy-prover/local"]
std = [
    "log/std",
    "anyhow/std",
    "codec/std",
    "ismp/std",
    "primitive-types/std",
    "beefy-verifier-primitives/std",
    "polkadot-sdk/std",
    "merkle-mountain-range/std",
    "rs_merkle/std",
    "sp1-verifier/std",
    "alloy-sol-types/std",
    "sha2?/std",
    "ark-bls12-381?/std",
    "ark-ec?/std",
    "ark-ff?/std",
    "ark-serialize?/std",
    "gnark-plonk-verifier?/std",
]