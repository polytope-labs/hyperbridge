[package]
name = "apk-beefy"
version = "0.1.0"
edition = "2021"
authors = ["Polytope Labs <hello@polytope.technology>"]
description = "Builds BEEFY consensus proofs carrying an aggregate public key proof"

[dependencies]
anyhow = "1.0.79"
async-trait = { workspace = true }
hex = { workspace = true }
alloy-primitives = { workspace = true, default-features = true }
subxt = { workspace = true, default-features = true }
sp-consensus-beefy = { workspace = true }

beefy-prover = { workspace = true, features = ["bls-aggregate"] }
beefy-verifier-primitives = { workspace = true, default-features = true }
apk-commitment = { workspace = true, default-features = true }
ismp-abi = { workspace = true, default-features = true }

ark-bls12-381 = { version = "0.4.0", features = ["curve"], default-features = false }
ark-ec = { version = "0.4.0", default-features = false }
ark-ff = { version = "0.4.0", default-features = false }
ark-serialize = { version = "0.4.0", default-features = false }

[dependencies.gnark-apk-prover]
git = "https://github.com/polytope-labs/gnark-apk-proofs"
rev = "ee8c879fac84ba737a9b0bfbfead8fbb2d0228a4"
optional = true

[dependencies.ark-serialize-05]
package = "ark-serialize"
version = "0.5"
optional = true

[dependencies.tokio]
workspace = true
features = ["rt"]

[features]
default = []
local = ["dep:gnark-apk-prover", "dep:ark-serialize-05"]
