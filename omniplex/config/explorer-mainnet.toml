# Hyperbridge's block explorer on mainnet. It reads every block from genesis through the
# substrate-eth-rpc served by an archive node, so point `NEXUS_EXPLORER` and
# `NEXUS_EXPLORER_SUBSTRATE` at our own node, never at a public RPC.

environment = "mainnet"
explorer = true

[chains.nexus-explorer]
kind = "substrate"
chain_id = 1000003367  # substrate-eth-rpc eth_chain_id
state_machine_id = "POLKADOT-3367"
start_block = 1
reorg_safe_distance = 0
max_block_range = 100
