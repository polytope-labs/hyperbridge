[workspace]

[package]
name = "hyperbridge-indexer"
version = "0.1.0"
edition = "2021"
publish = false
description = "Hyperbridge indexer: rindexer handlers writing the tables omnihedron serves"

[dependencies]
rindexer = { git = "https://github.com/joshstevens19/rindexer", tag = "v0.43.4" }
alloy = { version = "2.0.4", features = ["sol-types", "json-abi", "provider-http", "rpc-types", "contract"] }
alloy-chains = "0.2"
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rust_decimal = { version = "1.41", features = ["db-tokio-postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
toml = "0.8"
tracing = "0.1"
