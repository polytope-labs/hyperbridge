type Book {
	id: ID!
	base: String!
	quote: String!
	"""
	The highest bid level price, across fill chains.
	"""
	bestBid: BigInt
	"""
	The lowest ask level price, across fill chains.
	"""
	bestAsk: BigInt
	"""
	`bestAsk − bestBid`; null when a side is empty, or when the book is crossed (the best bid
	and the best ask can sit on different fill chains). `mid` is still served for a crossed
	book.
	"""
	spread: BigInt
	"""
	The midpoint of `bestBid` and `bestAsk`, rounded down.
	"""
	mid: BigInt
	"""
	The book: one price level per (fillChain, price bucket) on a side, best price first.
	`sourceChain` keeps only the orders whose own declaration lists it, whichever chain they fill
	on, as `orders` does; `rates` and `quote` also count orders already on that chain.
	"""
	levels(side: Side!, fillChain: String, sourceChain: String): [PriceLevel!]!
	"""
	True liquidity behind the side's surfaced orders matching fillChain and sourceChain: per
	distinct (solver, fill chain), what its balance backs of its validated orders among them,
	their sum as far as the balance covers it, summed (1e18, in the token the side pays out). Unvalidated orders add nothing. `sourceChain` matches as in
	`levels`: orders whose own declaration lists it.
	"""
	availableLiquidity(side: Side!, fillChain: String, sourceChain: String): BigInt!
	"""
	Individual orders, oldest first: the ACTIVE ones unless `status` asks for SUSPENDED.
	`sourceChain` matches orders whose own declaration lists it, whichever chain they fill on.
	`minSize` (1e18) keeps those advertising at least that much of the token `side` pays out
	(quote for BID, base for ASK), so it requires `side`.
	"""
	orders(side: Side, fillChain: String, sourceChain: String, minSize: BigInt, status: OrderStatus, first: Int = 50, after: String): OrderConnection!
}

