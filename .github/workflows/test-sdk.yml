name: "@hyperbridge/sdk"

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
    push:
        branches: [main]
        paths:
            - "sdk/packages/sdk/**"
            - "sdk/packages/indexer/**"
            - "sdk/packages/simplex/**"
            - "sdk/packages/simplex-desktop/**"
            - ".github/workflows/test-sdk.yml"
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened, ready_for_review]
        paths:
            - "sdk/packages/sdk/**"
            - "sdk/packages/indexer/**"
            - "sdk/packages/simplex/**"
            - "sdk/packages/simplex-desktop/**"
            - ".github/workflows/test-sdk.yml"
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: sdk
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11

            - name: Install dependencies
              run: pnpm install

            - name: Set up environment variables
              run: |
                  cat > .env.local << EOF
                  BSC_CHAPEL=${{ secrets.BSC_CHAPEL }}
                  GNOSIS_CHIADO=${{ secrets.GNOSIS_CHIADO }}
                  HYPERBRIDGE_GARGANTUA=${{ secrets.HYPERBRIDGE_GARGANTUA }}
                  PASEO_RPC_URL=${{ secrets.PASEO_RPC_URL }}
                  BIFROST_PASEO=${{ secrets.BIFROST_PASEO }}
                  INDEXER_URL=${{ secrets.INDEXER_URL }}
                  PRIVATE_KEY=${{ secrets.PRIVATE_KEY }}
                  SECRET_PHRASE=${{ secrets.SECRET_PHRASE }}
                  ETH_MAINNET=${{ secrets.ETH_MAINNET }}
                  BSC_MAINNET=${{ secrets.BSC_MAINNET }}
                  BASE_MAINNET=${{ secrets.BASE_MAINNET }}
                  POLYGON_MAINNET=${{ secrets.POLYGON_MAINNET }}
                  ARBITRUM_MAINNET=${{ secrets.ARBITRUM_MAINNET }}
                  BASE_SEPOLIA=${{ secrets.BASE_SEPOLIA }}
                  POLYGON_AMOY=${{ secrets.POLYGON_AMOY }}
                  SEPOLIA=${{ secrets.SEPOLIA }}
                  BUNDLER_URL=${{ secrets.BUNDLER_URL }}
                  COIN_GECKGO_API_KEY=${{secrets.COINGECKO}}
                  TOKEN_GATEWAY_ADDRESS: "0xFcDa26cA021d5535C3059547390E6cCd8De7acA6"
                  TURNKEY_ORG_ID=${{ secrets.TURNKEY_ORG_ID }}
                  TURNKEY_API_PUBLIC_KEY=${{ secrets.TURNKEY_API_PUBLIC_KEY }}
                  TURNKEY_API_PRIVATE_KEY=${{ secrets.TURNKEY_API_PRIVATE_KEY }}
                  TURNKEY_SIGN_WITH=${{ secrets.TURNKEY_SIGN_WITH }}
                  EOF

            - name: Build packages
              run: pnpm build
              env:
                  ENV: local

            - name: Install Docker Compose
              run: |
                  sudo apt-get update
                  sudo apt-get install -y docker-compose
                  docker compose version

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

            - name: Start local indexer (in background)
              env:
                  DB_USER: "postgres"
                  DB_PASS: "postgres"
                  DB_DATABASE: "postgres"
                  DB_HOST: "postgres"
                  DB_PORT: 5432
                  DB_PATH: "./.indexer"
                  LOG_LEVEL: ${{ secrets.ACTIONS_RUNNER_DEBUG == 'true' && 'debug' || 'info' }}
              run: |
                  cd packages/indexer
                  nohup pnpm start:local > indexer_output.log 2>&1 &
                  echo "Started indexer process in background"

            - name: Wait for GraphQL server to be available
              run: |
                  echo "Waiting for GraphQL server to be available on port 3100..."
                  timeout=300
                  elapsed=0
                  interval=5
                  while ! nc -z localhost 3100; do
                    if [ "$elapsed" -ge "$timeout" ]; then
                      echo "Timed out waiting for GraphQL server on port 3100"
                      cat packages/indexer/indexer_output.log
                      exit 1
                    fi
                    echo "Waiting for GraphQL server (elapsed: ${elapsed}s)..."
                    sleep $interval
                    elapsed=$((elapsed + interval))
                  done
                  echo "GraphQL server is available!"
                  sleep 10

            - name: Run SDK test - hyper-fungible-token
              run: pnpm --filter="@hyperbridge/sdk" test:hyper-fungible-token

            - name: Run SDK test - intents-coprocessor
              run: pnpm --filter="@hyperbridge/sdk" test:intents-coprocessor

            # Dead imports have shipped twice past tsc, which does not flag them.
            - name: Lint simplex
              run: pnpm --filter="@hyperbridge/simplex" lint

            - name: Check Simplex desktop
              run: |
                  pnpm --filter="@hyperbridge/simplex-desktop" typecheck
                  pnpm --filter="@hyperbridge/simplex-desktop" lint
                  pnpm --filter="@hyperbridge/simplex-desktop" test

            # Operators' existing bids.db/activity.db files, opened and migrated for real
            # against committed fixtures. Needs no network or secrets and runs in seconds;
            # test:filler names four specific files and would never reach it.
            - name: Run simplex data-store tests
              run: pnpm --filter="@hyperbridge/simplex" test:data

            # test:filler covers the network-backed suites; the CLI and logger units
            # were gated by nothing until 2026-09-10, so a broken flag stayed green.
            - name: Run simplex test - cli and logger units
              run: pnpm --filter="@hyperbridge/simplex" test:unit

            - name: Run simplex test
              run: pnpm --filter="@hyperbridge/simplex" test:filler

            - name: Run SDK test - concurrent (non-sequential tests)
              run: pnpm --filter="@hyperbridge/sdk" test:concurrent

            - name: Run SDK test - intent-gateway
              run: pnpm --filter="@hyperbridge/sdk" test:intent-gateway

            - name: Run SDK test - get request
              run: pnpm --filter="@hyperbridge/sdk" test:get-request

            - name: Clean up
              if: always()
              run: |
                  docker compose -f packages/indexer/docker/docker-compose.local.yml down || true
                  if [ -f packages/indexer/indexer_output.log ]; then
                    echo "Indexer logs:"
                    cat packages/indexer/indexer_output.log
                  fi

    desktop-runtime-integrity:
        name: Desktop Node runtime (${{ matrix.target }})
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-15
                      target: darwin-universal
                    - runner: ubuntu-latest
                      target: linux-x64
                    - runner: ubuntu-24.04-arm
                      target: linux-arm64
                    - runner: windows-latest
                      target: win32-x64
        defaults:
            run:
                working-directory: sdk
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11

            # The staging script needs openpgp and tar, but not Electron's downloaded
            # application binary. The binary under test is fetched from nodejs.org.
            - name: Install staging dependencies
              run: pnpm install --frozen-lockfile --filter="@hyperbridge/simplex-desktop..." --ignore-scripts

            - name: Verify and stage Node
              run: pnpm --filter="@hyperbridge/simplex-desktop" stage:node -- --target ${{ matrix.target }}

            - name: Execute staged Node on Unix
              if: runner.os != 'Windows'
              run: test "$(packages/simplex-desktop/resources/node/${{ matrix.target }}/node --version)" = "v24.19.0"

            - name: Execute staged Node on Windows
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $version = & "packages/simplex-desktop/resources/node/win32-x64/node.exe" --version
                  if ($version -ne "v24.19.0") { throw "Expected v24.19.0, got $version" }

    desktop-e2e-artifacts:
        name: Build Simplex desktop E2E artifacts
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: sdk
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  submodules: recursive

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11

            - name: Install desktop workspace dependencies
              run: pnpm install --frozen-lockfile --filter="@hyperbridge/simplex-desktop..."

            # Build once on Linux: the output is JavaScript and the generated proto
            # sources are portable. Each OS job below still stages and executes its
            # own verified Node runtime and downloads its native Electron binary.
            - name: Build SDK, Simplex, and Electron main process
              run: |
                  pnpm --filter="@hyperbridge/sdk" build
                  pnpm --filter="@hyperbridge/simplex" build
                  pnpm --filter="@hyperbridge/simplex-desktop" build
              env:
                  CI: "true"

            - name: Upload desktop E2E artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: simplex-desktop-e2e
                  path: |
                      sdk/packages/simplex/dist
                      sdk/packages/simplex/src/proto
                      sdk/packages/simplex-desktop/dist
                  if-no-files-found: error
                  retention-days: 1

    desktop-electron-e2e:
        name: Desktop Electron E2E (${{ matrix.target }})
        needs: desktop-e2e-artifacts
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-15
                      target: darwin-arm64
                    - runner: ubuntu-latest
                      target: linux-x64
                    - runner: ubuntu-24.04-arm
                      target: linux-arm64
                    - runner: windows-latest
                      target: win32-x64
        defaults:
            run:
                working-directory: sdk
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11

            - name: Install desktop workspace dependencies
              run: pnpm install --frozen-lockfile --filter="@hyperbridge/simplex-desktop..."

            - name: Download built desktop artifacts
              uses: actions/download-artifact@v4
              with:
                  name: simplex-desktop-e2e
                  path: sdk/packages

            - name: Install Linux display and listener tools
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y lsof xvfb

            - name: Verify and stage the host Node runtime
              run: pnpm --filter="@hyperbridge/simplex-desktop" stage:node -- --target ${{ matrix.target }}

            - name: Run cross-platform desktop tests
              run: pnpm --filter="@hyperbridge/simplex-desktop" test

            - name: Run Electron E2E on Linux
              if: runner.os == 'Linux'
              run: xvfb-run -a pnpm --filter="@hyperbridge/simplex-desktop" test:e2e

            - name: Run Electron E2E on macOS and Windows
              if: runner.os != 'Linux'
              run: pnpm --filter="@hyperbridge/simplex-desktop" test:e2e

    # Full phantom-order flow: a locally-built simnode emits the order, real simplex IntentFillers
    # watch + submit USDC->cNGN bids, and the SDK aggregation reduces them to a snapshot — simulated
    # against an anvil fork of Base mainnet (needs eth_simulateV1 + the real gateway/tokens).
    phantom-filler-e2e:
        name: Phantom filler E2E (simnode + anvil)
        runs-on: arc-runner-set
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  submodules: recursive

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y clang netcat wget curl libssl-dev llvm libclang-dev libudev-dev make libprotobuf-dev protobuf-compiler pkg-config
                  echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> $GITHUB_ENV

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@nightly
              with:
                  toolchain: stable

            - name: Add wasm toolchain
              run: rustup target add wasm32-unknown-unknown --toolchain nightly

            - uses: webfactory/ssh-agent@v0.7.0
              with:
                  ssh-private-key: ${{ secrets.SSH_KEY }}

            - uses: Swatinem/rust-cache@v2

            - name: Install Foundry (anvil)
              uses: foundry-rs/foundry-toolchain@v1
              with:
                  # Pinned, not `stable`, for the same reason as evm.yml. Foundry v1.8.0
                  # (2026-08-27) probes `anvil_nodeInfo` to work out an endpoint's network family,
                  # and providers that answer it with HTTP 400 fail the fork outright — here that
                  # would take down both `anvil --fork-url` instances below and with them the whole
                  # phantom-filler E2E. v1.7.1 is the last version this suite ran green on. Revert
                  # to `stable` once upstream stops probing, or once the fork URL is a provider that
                  # answers it, and do it in both workflows together.
                  version: v1.7.1

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11

            # Required by the sp1-recursion-gnark-ffi build script, which compiles a Go library.
            - name: Install Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.24"

            - name: Build hyperbridge simnode
              run: cargo build -p hyperbridge

            - name: Install + build SDK
              working-directory: sdk
              run: |
                  pnpm install
                  pnpm --filter "@hyperbridge/sdk" build:node

            # The second anvil forks Base but reports Optimism's chain id, presenting the same
            # forked state as a second chain (EVM-10) — the protocol contracts are CREATE2-deployed
            # at the same addresses everywhere, so the EVM-10 config finds them in Base state.
            - name: Run phantom-filler E2E (two anvil forks of Base + simnode)
              env:
                  SIMNODE_URL: ws://127.0.0.1:9991
                  ANVIL_URL: http://127.0.0.1:8545
                  ANVIL2_URL: http://127.0.0.1:8546
              run: |
                  anvil --fork-url "${{ secrets.BASE_MAINNET }}" --port 8545 --silent &
                  anvil --fork-url "${{ secrets.BASE_MAINNET }}" --port 8546 --chain-id 10 --silent &
                  ./target/debug/hyperbridge simnode --chain gargantua-1000 --rpc-port 9991 --port 40341 --tmp --rpc-methods=unsafe --rpc-cors=all --pool-type=single-state &
                  ./scripts/wait_for_tcp_port_opening.sh localhost 8545
                  ./scripts/wait_for_tcp_port_opening.sh localhost 8546
                  ./scripts/wait_for_tcp_port_opening.sh localhost 9991
                  cd sdk && pnpm --filter "@hyperbridge/simplex" test:phantom-filler-e2e

            - name: Cleanup
              if: always()
              run: |
                  pkill -f "hyperbridge simnode" || true
                  pkill -f "anvil --fork-url" || true
