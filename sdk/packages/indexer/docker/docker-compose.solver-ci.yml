# The solver-inventory E2E's indexer: the Hyperbridge node that polls the fake orderbook, and one
# EVM node indexing an anvil fork of Base.
#
# Both nodes run on the host network, because what they read lives on the host: the fork's RPC and
# the fake orderbook's `GET /solvers`. Postgres and the query service stay on the default bridge and
# publish their ports, which is how the host-network nodes and the assertions reach them.
services:
    subquery-node-hyperbridge-gargantua-solver-ci:
        image: polytopelabs/subql-node-substrate:v6.4.8-0
        restart: always
        network_mode: host
        environment:
            DB_USER: ${DB_USER}
            DB_PASS: ${DB_PASS}
            DB_DATABASE: ${DB_DATABASE}
            DB_HOST: 127.0.0.1
            DB_PORT: ${DB_PORT}

        depends_on:
            postgres:
                condition: service_healthy

        volumes:
            - ../src/configs:/app
            - ../dist:/app/dist
        command:
            - ${SUB_COMMAND:-}
            - -f=/app/hyperbridge-gargantua.yaml
            - --db-schema=app
            - --workers=${SUBQL_WORKERS:-2}
            - --batch-size=${SUBQL_BATCH_SIZE:-10}
            - --multi-chain
            - --disable-multichain-rewind-lock
            - --allow-schema-migration
            - --unsafe
            - --log-level=${LOG_LEVEL:-info}
            # This node starts at the chain's head, where the best header moves under it. Without
            # unfinalized-block tracking it dies on an assertion inside UnfinalizedBlocksService
            # ("Expect best header and checking header to be at the same height") and, with
            # restart: always, crash-loops — polling the watchlist only in the gaps between restarts.
            - --unfinalized-blocks
            - --store-cache-async=false
            - --store-cache-threshold=1

        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3000/ready"]
            interval: 3s
            timeout: 5s
            retries: 30

    subquery-node-base-solver-ci:
        image: subquerynetwork/subql-node-ethereum:v6.5.0
        restart: always
        network_mode: host
        environment:
            DB_USER: ${DB_USER}
            DB_PASS: ${DB_PASS}
            DB_DATABASE: ${DB_DATABASE}
            DB_HOST: 127.0.0.1
            DB_PORT: ${DB_PORT}

        depends_on:
            postgres:
                condition: service_healthy
            subquery-node-hyperbridge-gargantua-solver-ci:
                condition: service_healthy

        volumes:
            - ../src/configs:/app
            - ../dist:/app/dist
        command:
            - ${SUB_COMMAND:-}
            - -f=/app/base-solver-ci.yaml
            - --db-schema=app
            # Both nodes share the host's network namespace, so this one moves off the default 3000.
            - --port=3001
            - --workers=${SUBQL_WORKERS:-2}
            - --batch-size=${SUBQL_BATCH_SIZE:-10}
            - --multi-chain
            - --disable-multichain-rewind-lock
            - --unsafe
            - --log-level=${LOG_LEVEL:-info}
            - --historical=timestamp
            - --unfinalized-blocks
            # anvil mines on a timer and never reorgs, so waiting on confirmations would only
            # delay every assertion behind it.
            - --block-confirmations=0
            - --store-cache-async=false
            - --store-cache-threshold=1

        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3001/ready"]
            interval: 3s
            timeout: 5s
            retries: 30

    # Waits for the substrate node, not just postgres: that node owns the schema's DDL, and the
    # query service reads the tables once at startup and never again. Started any earlier it would
    # serve a Query type with no entities on it, and no amount of indexing afterwards would add them.
    graphql-engine:
        image: polytopelabs/omnihedron:latest
        restart: always
        ports:
            - 3100:3000
        environment:
            DB_USER: ${DB_USER}
            DB_PASS: ${DB_PASS}
            DB_DATABASE: ${DB_DATABASE}
            DB_HOST: postgres
            DB_PORT: ${DB_PORT}
        depends_on:
            postgres:
                condition: service_healthy
            subquery-node-hyperbridge-gargantua-solver-ci:
                condition: service_healthy
        command:
            - --name=app
            - --playground
            - --query-timeout=0

    postgres:
        image: postgres:14-alpine
        ports:
            - 5432:5432
        environment:
            POSTGRES_PASSWORD: ${DB_PASS}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_DB: ${DB_DATABASE}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
            interval: 10s
            timeout: 5s
            retries: 5
        command: |
            bash -c '
              docker-entrypoint.sh postgres &

              sleep 5

              until pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB; do
                echo "Waiting for PostgreSQL to start..."
                sleep 1
              done

              echo "Creating btree_gist extension..."
              psql -v ON_ERROR_STOP=1 -U $$POSTGRES_USER -d $$POSTGRES_DB -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"

              wait
            '
