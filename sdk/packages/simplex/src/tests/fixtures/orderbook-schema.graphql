type Mutation {
	"""
	Place one order from a signed phantom fillOrder UserOp. validUntil = TTL in seconds from
	receipt.
	"""
	submitOrder(userOp: Bytes!): SubmitOrderResult!
	"""
	Place several orders (e.g. both sides of a pair). Not atomic: one result per op, in order.
	"""
	submitOrders(userOps: [Bytes!]!): [SubmitOrderResult!]!
	"""
	Post a bid on one leg of a swapper's order: the signed, executable fillOrder UserOp the
	solver would have sent to the coprocessor, SCALE-encoded. It is verified as an order is,
	except that it need not be phantom, carries no TTL and declares nothing. It quotes exactly
	one of the order's legs, a positive take and quote, and declines the rest with zeros; a
	solver fills the other legs with bids of their own. Its rate is `outputs[leg].amount` over
	`inputs[leg].amount`, reported as signed. It is accepted only from a solver that is active
	and holds an active limit order on that leg's book filling on the order's destination
	chain (`NO_LIMIT_ORDER`); a solver may post any number of bids on one order. It is served under the order's commitment for
	`serverInfo.bidTtlSecs`, then deleted; re-sending it meanwhile is `BidUnchanged`, and
	afterwards posts it afresh. Counts one op against the request's batch budget.
	"""
	submitBid(userOp: Bytes!): SubmitBidResult!
	"""
	Cancel one of the signer's orders. Signs EIP-712 CancelOrder(solver, commitment, timestamp).
	"""
	cancelOrder(solver: Address!, commitment: Bytes!, timestamp: Int!, signature: Bytes!): CancelOrderResult!
	"""
	Keep the signer's orders surfaced. Signs EIP-712 Heartbeat(solver, timestamp).
	"""
	heartbeat(solver: Address!, timestamp: Int!, signature: Bytes!): HeartbeatResult!
}

type Order {
	solver: Solver!
	commitment: Bytes!
	book: Book!
	side: Side!
	status: OrderStatus!
	"""
	Where the solver fills the order and the swapper receives `tokenOut`.
	"""
	fillChain: String!
	"""
	What the solver receives: the swapper's `tokenIn`.
	"""
	tokenIn: String!
	"""
	What the solver pays out: the swapper's `tokenOut`.
	"""
	tokenOut: String!
	"""
	This order's price and its rate, one number: quote per 1 base (1e18), on its signed amounts,
	before the protocol fee. Bids round down, asks up.
	"""
	price: BigInt!
	"""
	The signed input (1e18).
	"""
	inputAmount: BigInt!
	"""
	The signed output (1e18), before the protocol fee: what the solver pays, checked against
	the balance.
	"""
	quotedAmount: BigInt!
	"""
	`min(quotedAmount, balance)`, exact (1e18): the depth this order publishes.
	"""
	advertisedSize: BigInt!
	"""
	What the quote alone allows (1e18); equal to `advertisedSize` when fully backed.
	"""
	quotedSize: BigInt!
	"""
	Whether the balance, not the quote, is what binds `advertisedSize`.
	"""
	resized: Boolean!
	"""
	The level this order sits in.
	"""
	priceBucket: BigInt!
	"""
	The input scaled to the advertised size (1e18).
	"""
	inputSize: BigInt!
	ttlSecs: Int!
	receivedAt: DateTime!
	expiresAt: DateTime!
	"""
	The last cycle that read this order's balance; null until one has, and the order surfaces
	at its quoted size meanwhile.
	"""
	validatedAt: DateTime
	"""
	Whether the solver's current balance covers the whole signed quote. False while the order is
	resized, and before any balance has been read.
	"""
	backed: Boolean!
	"""
	The balance this order is backed by, once a cycle has read one.
	"""
	balance: SolverBalance
	"""
	Source chains this order accepts swaps from, from its own signed declaration. Never empty:
	ingest refuses an order that declares none.
	"""
	acceptedSources: [String!]!
	"""
	The signed UserOp, SCALE-encoded as it was submitted.
	"""
	userOp: Bytes!
}

