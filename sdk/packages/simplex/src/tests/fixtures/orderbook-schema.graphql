type Bid {
	solver: Solver!
	"""
	The swapper's order this bid fills: `keccak256(abi.encode(order))`.
	"""
	commitment: Bytes!
	"""
	Which of the order's legs the bid quotes, from 0: `order.inputs[leg]` for
	`order.output.assets[leg]`. The bid declines the order's other legs; a solver fills each
	leg with a bid of its own. Most orders carry one leg.
	"""
	leg: Int!
	book: Book!
	"""
	The side of the book the bid is on: BID where the solver buys the base, ASK where it sells
	it.
	"""
	side: Side!
	"""
	The order's destination, where the bid executes and `tokenOut` is delivered.
	"""
	fillChain: String!
	"""
	The order's source, where the swapper's `tokenIn` is escrowed.
	"""
	sourceChain: String!
	"""
	What the solver takes: the swapper's `tokenIn`.
	"""
	tokenIn: String!
	"""
	What the solver pays out: the swapper's `tokenOut`.
	"""
	tokenOut: String!
	"""
	The rate the bid signed, quote per 1 base (1e18), before the protocol fee: `amountOut` over
	`amountIn`, rounded against the swapper. Reported as signed, not held to the solver's limit
	orders.
	"""
	price: BigInt!
	"""
	The input the bid takes of the leg (1e18 `tokenIn`): `options.inputs[leg].amount`.
	"""
	amountIn: BigInt!
	"""
	What the solver pays for that take (1e18 `tokenOut`), before the protocol fee:
	`options.outputs[leg].amount`.
	"""
	amountOut: BigInt!
	receivedAt: DateTime!
	"""
	When the server stops serving the bid: `receivedAt` plus `serverInfo.bidTtlSecs`. The op's
	own `validUntil` is a block number on `fillChain`, which the gateway checks and this server
	does not.
	"""
	expiresAt: DateTime!
	"""
	The signed UserOp, SCALE-encoded as it was submitted: what the swapper executes.
	"""
	userOp: Bytes!
}

