[package]
name = "ismp-tempo"
version = "0.1.0"
edition = "2021"
description = "ISMP Consensus Client for the Tempo blockchain"
authors = ["Polytope Labs <hello@polytope.technology>"]
publish = false

[dependencies]
codec = { workspace = true }
pallet-ismp-host-executive = { workspace = true, default-features = false }
ismp = { workspace = true, default-features = false }
tempo-verifier = { workspace = true, default-features = false }
evm-state-machine = { workspace = true }

[features]
default = ["std"]
std = [
    "codec/std",
    "pallet-ismp-host-executive/std",
    "ismp/std",
    "tempo-verifier/std",
    "evm-state-machine/std",
]
