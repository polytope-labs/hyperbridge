	cursor: String!
}

"""
The book as one validation tick left it, on one fill chain or across all of them.
"""
type BookHistoryPoint {
	recordedAt: DateTime!
	"""
	Null for the book across chains.
	"""
	fillChain: String
	"""
	The highest surfaced bid, quote per 1 base (1e18), as `book.bestBid` served it; null while
	there were no bids.
	"""
	bestBid: BigInt
	"""
	The lowest surfaced ask (1e18); null while there were no asks.
	"""
	bestAsk: BigInt
	"""
	The midpoint of `bestBid` and `bestAsk`, rounded down; null unless both sides had a price.
	"""
	mid: BigInt
	"""
	`bestAsk − bestBid`; null while a side was empty or the book was crossed.
	"""
	spread: BigInt
	"""
	Virtual: the surfaced bids' input sizes, summed (1e18 base).
	"""
	bidDepthBase: BigInt!
	"""
	Virtual: the surfaced bids' advertised sizes, summed (1e18 quote).
	"""
	bidDepthQuote: BigInt!
	"""
	Virtual: the surfaced asks' advertised sizes, summed (1e18 base).
	"""
	askDepthBase: BigInt!
	"""
	Virtual: the surfaced asks' input sizes, summed (1e18 quote).
	"""
	askDepthQuote: BigInt!
	"""
	True: each (solver, fill chain)'s largest validated surfaced bid, summed, in quote (1e18).
	"""
	bidLiquidity: BigInt!
	"""
	True: each (solver, fill chain)'s largest validated surfaced ask, summed, in base (1e18).
	"""
	askLiquidity: BigInt!
	bidOrders: Int!
	askOrders: Int!
	"""
	Distinct solvers among the surfaced bids.
