"""
A pessimistic quote: one price, from the first level on the route, best first, deep enough to
fill the whole trade by itself, or else the route's worst price when its levels together can.
"""
type LevelQuote {
	route: RouteKind!
	"""
	ASK for a buy (tokenIn is the quote), BID for a sell (tokenIn is the base).
	"""
	side: Side!
	"""
	The tokenIn priced (1e18), floored to a whole raw unit on sourceChain.
	"""
	amountIn: BigInt!
	"""
	The tokenOut the swapper receives at `rate` (1e18), after destinationChain's protocol fee,
	floored to a whole raw unit there. When not fillable, what the whole amountIn would receive
	at the worst level's price, which the route cannot deliver.
	"""
	amountOut: BigInt!
	"""
	The worst single-order price in the level that fills it, quote per 1 base (1e18), before
	the protocol fee: every order in the level, or on the route when no one level can, fills at
	it. When not fillable, the route's worst single-order price. Null only when no order serves
	the route.
	"""
	rate: BigInt
	"""
	The price bucket of that level: the route's worst level when no one level fills it, or when
	not fillable. Null only when no order serves the route.
	"""
	priceBucket: BigInt
	"""
	The least slippage the swapper should allow for, in basis points: destinationChain's protocol
	fee plus how far `rate` sits from the route's best price, against the swapper, rounded up.
	`amountOut` already has the fee taken off.
	"""
	slippageBps: Int!
	fillable: Boolean!
	"""
	The largest amountIn this quote could fill (1e18 tokenIn, whole raw units): any one level at
	its worst price, or the whole route at its worst.
	"""
	maxFillableIn: BigInt!
}

