name: "Publish @hyperbridge/simplex"

on:
    push:
        tags:
            - "simplex-v[0-9]+.[0-9]+.[0-9]+"

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: true

env:
    DOCKERHUB_IMAGE: polytopelabs/simplex
    GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/simplex

jobs:
    # One job per architecture, each on a runner of that architecture — a QEMU-emulated
    # arm64 build of this image (pnpm install + tsup + vite + a native sqlite module) is
    # an order of magnitude slower than a native one. Each job pushes an untagged,
    # single-platform image by digest; `merge` stitches the digests into one manifest list
    # per tag, so `docker pull polytopelabs/simplex` resolves natively on Intel and on
    # Apple Silicon / Windows-on-ARM alike.
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-latest
                    - platform: linux/arm64
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout sources
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  # packages/simplex/proto/mpcvaultapis — the image's protoc codegen step
                  # reads it out of the build context, and .git is not in the context.
                  submodules: recursive

            - name: Prepare
              run: |
                  echo "VERSION=${GITHUB_REF#refs/tags/simplex-v}" >> $GITHUB_ENV
                  echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
              env:
                  platform: ${{ matrix.platform }}

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: sdk
                  file: sdk/packages/simplex/scripts/Dockerfile
                  platforms: ${{ matrix.platform }}
                  # Identical content in both registries yields one digest, so `merge` can
                  # reuse it for either manifest list.
                  outputs: type=image,"name=${{ env.DOCKERHUB_IMAGE }},${{ env.GHCR_IMAGE }}",push-by-digest=true,push=true
                  cache-from: type=gha,scope=simplex-${{ matrix.platform }}
                  cache-to: type=gha,mode=max,scope=simplex-${{ matrix.platform }}

            - name: Export digest
              run: |
                  mkdir -p /tmp/digests
                  touch "/tmp/digests/${DIGEST#sha256:}"
              env:
                  DIGEST: ${{ steps.build.outputs.digest }}

            - name: Upload digest
              uses: actions/upload-artifact@v4
              with:
                  name: digests-${{ env.PLATFORM_PAIR }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge:
        runs-on: ubuntu-latest
        needs: build
        permissions:
            contents: read
            packages: write
        steps:
            - name: Download digests
              uses: actions/download-artifact@v4
              with:
                  path: /tmp/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Extract version from tag
              run: echo "VERSION=${GITHUB_REF#refs/tags/simplex-v}" >> $GITHUB_ENV

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Create manifest lists and push
              working-directory: /tmp/digests
              run: |
                  for image in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
                    docker buildx imagetools create \
                      -t "${image}:v${VERSION}" \
                      -t "${image}:latest" \
                      $(printf "${image}@sha256:%s " *)
                  done

            - name: Inspect manifest
              run: docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:v${VERSION}"

    # Publishes the npm library. Runs independently of the docker jobs — the image
    # ships the bundled CLI, this ships the importable package, and neither waits on
    # the other. The GitHub release DOES wait on both (see generate-changelog): a
    # release note announcing an npm package that failed to publish would lie, and a
    # failed job is re-runnable from the Actions tab.
    publish-npm:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        defaults:
            run:
                working-directory: sdk
        steps:
            - name: Checkout sources
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  # scripts/build.sh runs protoc over proto/mpcvaultapis to generate
                  # src/proto; without the submodule the build has nothing to compile.
                  submodules: recursive

            - name: Refuse a tag that disagrees with the manifest
              run: |
                  TAG_VERSION="${GITHUB_REF#refs/tags/simplex-v}"
                  PKG_VERSION="$(node -p "require('./packages/simplex/package.json').version")"
                  if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
                    echo "Tag simplex-v${TAG_VERSION} does not match package.json ${PKG_VERSION}." >&2
                    echo "npm would publish ${PKG_VERSION} under a tag claiming ${TAG_VERSION}." >&2
                    exit 1
                  fi

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  registry-url: "https://registry.npmjs.org"

            - name: Setup pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: "latest"

            - name: Install protoc
              run: |
                  sudo apt-get update
                  sudo apt-get install -y protobuf-compiler

            - name: Install dependencies
              run: pnpm install

            # @hyperbridge/sdk is a workspace dependency, and simplex's .d.ts inlines
            # types from it — build it first or the published types are stale.
            - name: Build workspace dependencies
              run: pnpm --filter="@hyperbridge/simplex^..." build

            - name: Build simplex
              run: pnpm --filter="@hyperbridge/simplex" build

            - name: Authenticate with npm
              run: |
                  printf "//registry.npmjs.org/:_authToken=%s\n" "${NODE_AUTH_TOKEN}" > ~/.npmrc
                  npm whoami --registry=https://registry.npmjs.org
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            # pnpm rewrites the `workspace:*` dependency on @hyperbridge/sdk to its
            # concrete version as it packs. That version existing on npm is not enough:
            # the registry copy must MATCH the workspace simplex was built and tested
            # against, or consumers resolve types and a chain registry the build never
            # saw. The sdk-v<version> tag marks what was published; commits touching
            # packages/sdk after it mean "publish the sdk first".
            - name: Refuse an unpublished @hyperbridge/sdk
              run: |
                  SDK_VERSION="$(node -p "require('./packages/sdk/package.json').version")"
                  if ! git tag -l "sdk-v${SDK_VERSION}" | grep -q .; then
                    echo "::warning::No sdk-v${SDK_VERSION} tag found; cannot verify the npm sdk matches the workspace."
                    exit 0
                  fi
                  if ! git diff --quiet "sdk-v${SDK_VERSION}" HEAD -- packages/sdk; then
                    echo "packages/sdk changed since sdk-v${SDK_VERSION} was published." >&2
                    echo "Publish @hyperbridge/sdk first, then re-tag simplex." >&2
                    exit 1
                  fi

            - name: Publish to npm
              run: pnpm --filter="@hyperbridge/simplex" publish --access public --no-git-checks
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    generate-changelog:
        runs-on: ubuntu-latest
        needs: [merge, publish-npm]
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Get previous tag
              id: previous-tag
              run: |
                  CURRENT_TAG=${GITHUB_REF#refs/tags/}
                  PREVIOUS_TAG=$(git tag -l "simplex-v*" --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -n1)
                  echo "previous_tag=${PREVIOUS_TAG}" >> $GITHUB_OUTPUT
                  echo "current_tag=${CURRENT_TAG}" >> $GITHUB_OUTPUT
                  echo "clean_tag=${CURRENT_TAG#simplex-}" >> $GITHUB_OUTPUT

            - name: Generate changelog
              id: changelog
              run: |
                  CURRENT_TAG=${{ steps.previous-tag.outputs.current_tag }}
                  PREVIOUS_TAG=${{ steps.previous-tag.outputs.previous_tag }}

                  echo "Generating changelog for ${CURRENT_TAG}"
                  echo "Previous tag: ${PREVIOUS_TAG}"

                  if [ -z "$PREVIOUS_TAG" ]; then
                    COMMIT_RANGE="HEAD"
                  else
                    COMMIT_RANGE="${PREVIOUS_TAG}..${CURRENT_TAG}"
                  fi

                  CHANGELOG=$(git log --pretty=format:"* %s (%h)" $COMMIT_RANGE --reverse | grep -i "simplex")

                  echo "changelog<<EOF" >> $GITHUB_OUTPUT
                  echo "## What's Changed" >> $GITHUB_OUTPUT
                  echo "" >> $GITHUB_OUTPUT
                  echo "$CHANGELOG" >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Create GitHub Release
              uses: actions/create-release@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: ${{ steps.previous-tag.outputs.current_tag }}
                  release_name: "@hyperbridge/simplex ${{ steps.previous-tag.outputs.clean_tag }}"
                  body: ${{ steps.changelog.outputs.changelog }}
                  draft: false
                  prerelease: false
