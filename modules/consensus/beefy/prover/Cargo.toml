[package]
name = "beefy-prover"
version = "0.1.1"
edition = "2021"
authors = ["Polytope Labs <hello@polytope.technology>"]
description = "Prover for the BEEFY consensus client"
publish = false


[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
anyhow.workspace = true
primitive-types = { workspace = true, features = ["codec"] }
codec = { workspace = true, features = ["derive"], default-features = true }
derive_more = { workspace = true, features = ["from"], default-features = true }
rs_merkle = { workspace = true, default-features = true }
hex-literal = "0.4.1"
hex = { version = "0.4.3" }
w3f-bls = { version = "0.1.9", default-features = true, optional = true }

ark-bls12-381 = { version = "0.4.0", features = ["curve"], default-features = false, optional = true }
ark-ec = { version = "0.4.0", default-features = false, optional = true }
ark-ff = { version = "0.4.0", default-features = false, optional = true }
ark-serialize = { version = "0.4.0", default-features = false, optional = true }

subxt = { workspace = true, default-features = true }
subxt-core = { workspace = true, default-features = true }
beefy-verifier-primitives = { workspace = true }

ismp-abi = { workspace = true, default-features = true, optional = true }
alloy-primitives = { workspace = true, default-features = true, optional = true }
merkle-mountain-range = { workspace = true }
indicatif = "0.18.0"
futures = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
log = { workspace = true }

[dev-dependencies]
subxt-utils = { workspace = true, default-features = true }
tokio = { version = "1.35.1", features = ["fs", "macros", "rt-multi-thread"] }

[dependencies.polkadot-sdk]
workspace = true
default-features = true
features = [
    "sp-runtime",
    "sp-io",
    "pallet-beefy-mmr",
    "sp-mmr-primitives",
    "sp-consensus-beefy",
    "sp-trie",
    "sp-storage",
    "frame-support",
    "mmr-rpc",
]

[features]
local = []
# Prove a relay chain whose BEEFY authorities use the paired (ECDSA, BLS12-381) `ecdsa_bls_crypto`
# key type. On the wire such a chain carries 177-byte paired signatures and 177-byte authority
# public keys; with this feature the prover keeps only the ECDSA half of each (the keccak-ECDSA
# recoverable signature / compressed secp256k1 key), so the existing ECDSA verifier is unchanged.
#
# This changes how `beefy_authorities` and `decode_beefy_justification` read the wire, so it must
# not be enabled when proving a plain-ECDSA relay. It is deliberately separate from
# `bls-aggregate`, which only adds code.
bls = []
# Prove the BLS half instead: `crate::bls`, which builds a proof the aggregate verifier checks in
# a single pairing. Purely additive, so it is safe to enable alongside plain-ECDSA proving.
bls-aggregate = ["dep:w3f-bls", "dep:ismp-abi", "dep:alloy-primitives", "dep:ark-bls12-381", "dep:ark-ec", "dep:ark-ff", "dep:ark-serialize"]
