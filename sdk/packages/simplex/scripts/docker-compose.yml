# Runs the same on Linux, macOS and Windows (PowerShell or WSL2) — `docker compose up -d`.
# The simplex image is a multi-arch manifest, so amd64 and arm64 hosts both pull a native
# image. Nothing here uses host networking, which Docker Desktop does not provide.
#
# Generate the config into the data volume first (the terminal wizard, which works in a
# container; the browser wizard refuses to bind anything but loopback because it handles
# private keys, so it cannot be published out of one):
#
#   docker compose -f scripts/docker-compose.yml run --rm -it simplex init -o /data/filler-config.toml
services:
    simplex:
        image: polytopelabs/simplex:latest
        build:
            context: ../../..
            dockerfile: packages/simplex/scripts/Dockerfile
        container_name: hyperbridge-simplex
        restart: unless-stopped
        # Explicit config path: the default command would otherwise fall through to the
        # browser wizard, which cannot run with a published UI port.
        command: ["run", "-c", "/data/filler-config.toml", "--data-dir", "/data", "--ui", "0.0.0.0:8686", "-p", "0.0.0.0:9090"]
        ports:
            # Loopback-only publishing: the UI is unauthenticated, so it stays on this
            # machine. Drop the 127.0.0.1 prefix only on a trusted network.
            - "127.0.0.1:${SIMPLEX_UI_PORT:-8686}:8686" # operator web UI
            - "127.0.0.1:${SIMPLEX_METRICS_PORT:-9090}:9090" # prometheus metrics
        volumes:
            # Holds filler-config.toml, the bids database and runtime state. A named volume
            # works the same on every host OS; a bind mount would inherit that OS's file
            # ownership rules, which differ between Linux and Docker Desktop.
            - simplex-data:/data
            # Already have a config on the host? Mount it over the volume instead:
            # - ../filler-config.toml:/data/filler-config.toml:ro
        environment:
            - NODE_ENV=production
        networks:
            - simplex-network
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    prometheus:
        image: prom/prometheus:latest
        container_name: simplex-prometheus
        restart: unless-stopped
        volumes:
            - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus-data:/prometheus
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=30d"
            - "--web.enable-admin-api"
        networks:
            - simplex-network
        ports:
            - "${PROMETHEUS_PORT:-9091}:9090"

    grafana:
        image: grafana/grafana:latest
        container_name: simplex-grafana
        restart: unless-stopped
        volumes:
            - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
            - grafana-data:/var/lib/grafana
        environment:
            - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
            - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
            - GF_USERS_ALLOW_SIGN_UP=false
        networks:
            - simplex-network
        ports:
            - "${GRAFANA_PORT:-3420}:3000"

volumes:
    simplex-data:
    prometheus-data:
    grafana-data:

networks:
    simplex-network:
        driver: bridge
