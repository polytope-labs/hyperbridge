[package]
name = "governance-api"
version = "0.1.0"
edition = "2021"
description = "SubSquare compatible API for Hyperbridge governance"
authors = ["Polytope Labs <hello@polytope.technology>"]
publish = false

[dependencies]
anyhow = { workspace = true, features = ["std"] }
axum = { version = "0.7.9", features = ["multipart"] }
chrono = { version = "0.4.43", default-features = false, features = ["std"] }
dotenv = { workspace = true }
form_urlencoded = "1.2.2"
futures = { workspace = true }
hex = { workspace = true, features = ["std"] }
percent-encoding = "2.3.2"
rand = "0.8.5"
reqwest = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = "1.0.149"
sp-core = { workspace = true, features = ["std", "full_crypto"] }
sp-crypto-hashing = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-postgres = { version = "0.7.15", features = ["with-serde_json-1"] }
tower-http = { version = "0.5.2", features = ["cors"] }
tracing = { workspace = true }
tracing-subscriber = "0.3.19"
