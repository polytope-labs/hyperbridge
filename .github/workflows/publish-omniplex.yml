name: Omniplex Docker Publish

on:
    push:
        tags:
            - "omniplex-v[0-9]+.[0-9]+.[0-9]+"

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build_and_publish:
        runs-on: release-runner
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout sources
              uses: actions/checkout@v4

            - name: Resolve version
              id: version
              run: |
                  TAG=${GITHUB_REF#refs/tags/omniplex-v}
                  VERSION=$(grep -m1 '^version' omniplex/Cargo.toml | cut -d '"' -f2)
                  if [ "$TAG" != "$VERSION" ]; then
                    echo "Tag omniplex-v${TAG} does not match omniplex/Cargo.toml version ${VERSION}"
                    exit 1
                  fi
                  echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

            # rust-toolchain.toml names the toolchain.
            - name: Install toolchain
              run: rustup toolchain install

            # rindexer's build script packages its GraphQL server with npm.
            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Build
              run: |
                  cargo build --release --locked -p omniplex

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./scripts/docker/omniplex.Dockerfile
                  push: true
                  tags: |
                      polytopelabs/omniplex:v${{ steps.version.outputs.version }}
                      polytopelabs/omniplex:latest
                      ghcr.io/${{ github.repository_owner }}/omniplex:v${{ steps.version.outputs.version }}
                      ghcr.io/${{ github.repository_owner }}/omniplex:latest
