# Hyperbridge Intent Filler Simplified Configuration
# This is a minimal configuration file that leverages the SDK's built-in chain configurations
# Copy this file to filler-config.toml and update with your actual values
# Tip: `simplex init` builds this file interactively and explains every option as it asks

# Filler configuration
[simplex]
# Signer is a tagged union — set type, then add the variant's fields directly.
#
# 1) Private key signer:
# [simplex.signer]
# type = "privateKey"
# key = "0x..."
#
# 2) MPCVault signer:
# [simplex.signer]
# type = "mpcVault"
# apiToken = ""
# vaultUuid = ""
# accountAddress = "0x0000000000000000000000000000000000000000"
# callbackClientSignerPublicKey = "ssh-ed25519 AAAA..."
# grpcTarget = "api.mpcvault.com:443" # optional; default when omitted
#
# 3) Turnkey signer:
# [simplex.signer]
# type = "turnkey"
# organizationId = ""
# apiPublicKey = ""
# apiPrivateKey = ""
# signWith = "0xYourWalletAddress"
#
# 4) Secret phrase signer (BIP-39 mnemonic, English wordlist):
# [simplex.signer]
# type = "secretPhrase"
# phrase = "word1 word2 word3 word4 word5 word6 word7 word8 word9 word10 word11 word12"
# accountIndex = 0 # optional; wallet at m/44'/60'/0'/0/accountIndex, 0 when omitted

maxConcurrentOrders = 5

# ===== Solver Selection Mode Configuration =====
# Required when solver selection is active on any chain

# Substrate private key for signing Hyperbridge extrinsics
# Can be a hex seed (without 0x prefix) or mnemonic phrase
# Note: Submitting bids to Hyperbridge requires BRIDGE tokens for transaction fees
substratePrivateKey = ""

# Hyperbridge WebSocket URL
hyperbridgeWsUrl = ""

# Bid validity (optional)
# How long a signed bid stays executable, in seconds. Default: 300 (5 minutes).
#
# Written into `FillOptions.validUntil` and enforced on-chain by `fillOrder`, which reverts
# `FillExpired` past it. This is how long your quoted price stands as a firm commitment that
# the order placer may take up at a moment of their choosing: the order's own deadline is set
# by the placer with no upper bound, and retracting a bid on Hyperbridge does not reach the
# destination chain. Without this, a signed bid stays executable indefinitely and is taken up
# only once the rate has moved against you.
#
# Set in seconds; converted to a block height per destination chain.
#
# The default is deliberately tight. Raise it if you see bids lapsing before the placer selects
# a solver — a bid waits in the coprocessor until then, so an expiry shorter than the selection
# window costs you fills. Lower it further on volatile pairs, where a fixed price held open is
# real optionality given away.
#
# Ignored on gateways deployed before `FillOptions.validUntil` existed (the filler warns once
# per chain when that is the case).
# bidValiditySeconds = 300

# Minimum order size (optional)
# The order size, in USD, below which an order's fees must cover the cost of filling it: the
# fill gas plus, for a cross-chain order, the relayer fee. Default: 20.
#
# An order worth at least this much is filled whatever fees it carries, and the margin in the
# limit order that prices it pays for the gas. On a smaller order that margin is too thin, so
# an order below this size whose fees fall short is skipped.
#
# Raise it if gas on your chains costs more than your margin earns on a $20 fill. Set it to 0
# to never check fees. An order Simplex cannot value in dollars is treated as below it.
# minOrderSizeUsd = 20

# Gas fee bump configuration (optional)
# These values control how much to bump gas fees for UserOperation submission
# Both are percentages added ON TOP of the base gasPrice
# If not provided, defaults will be used (8% for priority fee, 10% for max fee)
# [simplex.gasFeeBump]
# maxPriorityFeePerGasBumpPercent = 8   # Percentage added to gasPrice for priority fee (default: 8)
# maxFeePerGasBumpPercent = 10          # Percentage added to gasPrice for max fee (default: 10)

# Overfill protection (optional)
# A bid offers the matched limit order's whole payout at its rate (capped by what the
# order has left), which can be more than the swapper asked for: the gateway credits the
# swapper the requested amount and splits the surplus between swapper and protocol.
# Nothing is clamped. The filler logs a warning when an offer exceeds
# (1 + maxOverfillBps / 10000) × the requested output, which usually means a limit order's
# amounts are mistyped. `maxConsecutiveClamps` is accepted but never halts the filler.
# If not provided, defaults will be used (maxOverfillBps = 500, maxConsecutiveClamps = 3)
# [simplex.overfillProtection]
# maxOverfillBps = 500          # warn when an offer is 5% above the requested output (default: 500)
# maxConsecutiveClamps = 3      # accepted, currently unused (default: 3)


# Logging level: trace, debug, info, warn, error
logging = "debug"

# Rebalancing configuration
# Trigger percentage: rebalancing triggers when balance falls to (1 - triggerPercentage) * baseBalance
# Example: triggerPercentage = 0.5 means trigger when balance <= 50% of base
# SimplexPaymaster fee-recycling keeper (optional) — used by the
# `simplex paymaster-keeper` subcommand, not by `run`. The keeper periodically
# calls the paymaster's onchain swapAndDeposit, which swaps accrued stablecoins
# to native (oracle-bounded) and deposits them into the EntryPoint. The signer
# must be the paymaster's treasury. Only [[chains]] and [simplex.signer] are
# required alongside this block.
# [keeper]
# chains = ["EVM-56"]     # default: every configured chain with a SimplexPaymaster
# intervalMinutes = 30
# minSwapUsd = 1          # skip tokens whose accrued balance is below this

[rebalancing]
triggerPercentage = 0.5

# Base balances per chain and per asset (in USD value, treated as $1 per token)
# Format: [rebalancing.baseBalances."USDC"] or [rebalancing.baseBalances."USDT"]
# Then specify per chainId as string keys
[rebalancing.baseBalances."USDC"]
"1" = "10000"      # Ethereum Mainnet: $10k USDC base
"56" = "10000"     # BSC Mainnet: $10k USDC base
"42161" = "10000"  # Arbitrum: $10k USDC base
"8453" = "10000"   # Base: $10k USDC base
"137" = "10000"    # Polygon: $10k USDC base
"130" = "10000"    # Unichain: $10k USDC base

[rebalancing.baseBalances."USDT"]
"1" = "10000"      # Ethereum Mainnet: $10k USDT base
"56" = "10000"     # BSC Mainnet: $10k USDT base
"42161" = "10000"  # Arbitrum: $10k USDT base
"8453" = "10000"   # Base: $10k USDT base
"137" = "10000"    # Polygon: $10k USDT base
"130" = "10000"    # Unichain: $10k USDT base

# Vault configuration (optional) — filler-wide stablecoin treasury.
# Any ERC-4626 vault works (e.g. Aave's stataToken); the underlying asset is
# resolved on-chain from the vault. Used for three things, sharing one vault list:
#   1. Sourcing: when wallet balance is short on a fill, withdraw the deficit
#      from the solver's vault position (atomic with the fill).
#   2. Sweeping: once wallet balance reaches `threshold`, a timer deposits
#      everything down to `minBalance`. Size `minBalance` to cover working fill
#      float plus gas/paymaster spend; `threshold` must be greater than it.
#   3. Shutdown: vault positions are redeemed back to the underlying asset.
# Omit `threshold`/`minBalance` on a vault to source-only (no sweeping) for that token.
# Positions are kept across restarts by default; set `redeemOnShutdown = true` to unwind on stop.
#
# [vault]
# sweepIntervalMs = 300000   # optional, default 5 min
# vaults = [
#     { chain = "EVM-8453", vault = "0xC768c589647798a6EE01A91FdE98EF2ed046DBD6", threshold = "5000", minBalance = "3000" },                       # Aave stataUSDC on Base
#     { chain = "EVM-42161", vault = "0xa6D12574eFB239FC1D2099732bd8b5dC6306897F", threshold = "5000", minBalance = "3000", redeemOnShutdown = true }, # Aave stataUSDT on Arbitrum, unwound on shutdown
# ]

# Allowlist configuration (optional)
# Restricts which order `user` addresses the filler will process.
# - Omit the entire [allowlist] section to accept orders from all users (default).
# - When present, only listed users are accepted. A source chain whose merged set
#   (global `users` + its bySource override) is empty rejects every order.
# - Address comparisons are case-insensitive.
#
# [allowlist]
# Users eligible across all source chains:
# users = [
#     "0x1111111111111111111111111111111111111111",
# ]
#
# Per-source-chain overrides, keyed by state machine id. Merged with the global list.
# [allowlist.bySource]
# "EVM-1"     = ["0x2222222222222222222222222222222222222222"]  # Ethereum-only partner
# "EVM-42161" = ["0x3333333333333333333333333333333333333333"]  # Arbitrum-only partner

# ===== Markets =====
#
# Prices do not live in this file. Simplex fills only against the limit orders
# you post to the orderbook (see [orderbook] below) while it runs: each one
# names what it takes in, what it pays out for that, and the chain it fills on.
# An incoming order that matches no limit order is not filled.
#
# [[pairs]] only names the markets the dashboard lists (and adds each
# cross-asset pair's token1 to the balances it tracks). It does not gate
# matching, and a config with no [[pairs]] at all is valid. Assets are
# referenced by symbol from Simplex's built-in registry — no address
# configuration needed. The registry ships USDC, USDT, DAI, CNGN (per-chain via
# the SDK, testnets included) plus curated mainnet deployments of USDR, ZARP,
# EURC, XSGD and TRYB, all verified on-chain.
#
# One orientation per market: declaring both USDC/CNGN and CNGN/USDC is refused.
# token0 == token1 is the same-asset cross-chain market.
#
# [[pairs]]
# token0 = "USDC"
# token1 = "CNGN"
#
# [[pairs]]
# token0 = "USDC"
# token1 = "USDC"
#
# [assets] is an OPTIONAL escape hatch: only needed for assets the registry
# does not ship, or to override a shipped address for your deployment.
# [assets.BRZ]
# "EVM-137" = "0xBrzOnPolygon"

# Per-chain confirmation policies for cross-chain orders (optional).
# Merged over built-in defaults (ETH, BSC, Polygon, Base, Arbitrum, Unichain);
# every configured chain must be covered or startup fails, testnets included.
# The curve amount axis is the order's USD value: USD stables count at $1, and
# other tokens are valued through the rates of your open limit orders.
[confirmationPolicies."1"]  # Ethereum Mainnet
points = [
    { amount = "5", value = 3 },
    { amount = "500", value = 6 },
    { amount = "5000", value = 12 },
]

[confirmationPolicies."56"]  # BSC Mainnet
points = [
    { amount = "1", value = 3 },
    { amount = "500", value = 6 },
    { amount = "5000", value = 15 },
]

# The HyperFX orderbook simplex advertises its limit orders on. Required: every
# fill is priced from those limit orders, and simplex has no prices of its own.
# The limit orders themselves are not configured here — they are created from
# the dashboard's Limit orders page or POST /api/limit-orders and live in
# bids.db, because they are inventory you open and close while the filler runs.
# A URL without /graphql has it appended.
[orderbook]
url = "https://orderbook.hyperfx.finance/mainnet/graphql"   # testnet: https://orderbook.hyperfx.finance/testnet/graphql
# defaultTtlSecs = 31536000     # how long an order lives, and its posting's TTL; default 365 days, floor 900
# reconcileIntervalSecs = 300   # how often to check the orderbook still matches (default 300)
# requestTimeoutMs = 10000      # per orderbook request (default 10000)


# Remote access from a phone. Off by default. When enabled, simplex keeps an outbound
# SSH tunnel to a relay so a phone's SSH client can open this UI with a local port
# forward; the phone's session terminates inside simplex, the relay only sees ciphertext.
# Pair devices from the UI (Operations > Remote access); keys live under <data-dir>/tunnel/.
# [simplex.tunnel]
# enabled = true
# relay = "simplex.tunnel.polytope.technology:443"   # host[:port], port defaults to 443
# relayHostKey = "SHA256:..."                          # pin for a self-hosted relay; the hosted one is built in

# Chain configuration - RPC and bundler URLs are required
# Hyperbridge runs an ERC-4337 bundler for Ethereum, BSC, Arbitrum, Base and Polygon at
# https://bundler.polytope.technology/<chain>. It needs no API key. On any other chain, use a
# bundler that serves the EntryPoint the chain's solver account uses.
# Chain IDs are resolved automatically from the RPC endpoints.
# All other chain data (addresses, assets, etc.) comes from the SDK automatically.
#
# `rpcUrls` is always an array. Providing more than one URL enables quorum-mode log scanning:
# the event monitor fans every `eth_getLogs` batch out to all providers and requires a BFT
# quorum (floor(2N/3) + 1) to agree on identical results. URLs must resolve to different
# hostnames. The quorum is exactly the endpoints configured here; fills, gas estimation and
# balance reads always use the first healthy endpoint.
[[chains]]
rpcUrls = [""]      # Ethereum Mainnet — add more endpoints to enable quorum
bundlerUrl = "https://bundler.polytope.technology/ethereum"

[[chains]]
rpcUrls = [""]      # BSC Mainnet
bundlerUrl = "https://bundler.polytope.technology/bsc"

[[chains]]
rpcUrls = [""]      # Arbitrum Mainnet
bundlerUrl = "https://bundler.polytope.technology/arbitrum"

[[chains]]
rpcUrls = [""]      # Base Mainnet
bundlerUrl = "https://bundler.polytope.technology/base"

[[chains]]
rpcUrls = [""]      # Polygon Mainnet
bundlerUrl = "https://bundler.polytope.technology/polygon"

[[chains]]
rpcUrls = [""]      # Unichain Mainnet
bundlerUrl = ""


