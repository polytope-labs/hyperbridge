# ERC-4337 bundlers from the rundler fork for BSC Chapel and Polygon Amoy, EntryPoint v0.9 only.
# Chapel: RPC 4337, metrics 9337. Amoy: RPC 4338, metrics 9338.
x-rundler: &rundler
    build:
        context: ${RUNDLER_DIR:-../../../../rundler}
    restart: unless-stopped
    logging:
        driver: "json-file"
        options:
            max-size: "10m"
            max-file: "3"

services:
    rundler-chapel:
        <<: *rundler
        container_name: rundler-chapel
        command:
            - node
            - --network=bsc_testnet
            - --enabled_entry_points=v0.9
            # No traced validation: the paymaster reads tx.origin during validation.
            - --unsafe
            - --rpc.port=4337
            - --metrics.port=9337
        ports:
            - "127.0.0.1:4337:4337"
            - "127.0.0.1:9337:9337"
        environment:
            NODE_HTTP: ${CHAPEL_RPC_URL}
            SIGNER_PRIVATE_KEYS: ${RUNDLER_SIGNER_PRIVATE_KEY}
            RUST_LOG: ${RUST_LOG:-info}

    rundler-amoy:
        <<: *rundler
        container_name: rundler-amoy
        command:
            - node
            - --network=polygon_amoy
            - --enabled_entry_points=v0.9
            - --unsafe
            - --rpc.port=4338
            - --metrics.port=9338
        ports:
            - "127.0.0.1:4338:4338"
            - "127.0.0.1:9338:9338"
        environment:
            NODE_HTTP: ${AMOY_RPC_URL}
            SIGNER_PRIVATE_KEYS: ${RUNDLER_SIGNER_PRIVATE_KEY}
            # The polygon base spec has EIP-7702 off; the solver wallets are 7702-delegated.
            CHAIN_EIP7702_ENABLED: "true"
            RUST_LOG: ${RUST_LOG:-info}
