[package]
name = "kaia-verifier"
version = "0.1.0"
edition = "2021"
description = "Verifier for Kaia's Istanbul BFT consensus proofs"
authors = ["Polytope Labs <hello@polytope.technology>"]
publish = false

[dependencies]
alloy-rlp = { workspace = true }
alloy-primitives = { workspace = true }
alloy-rlp-derive = { workspace = true }
primitive-types = { workspace = true }
codec = { workspace = true }
scale-info = { workspace = true }
thiserror = { workspace = true }
ismp = { workspace = true, default-features = false }
ethabi = { workspace = true }
json = { workspace = true, features = ["alloc"] }

[dependencies.polkadot-sdk]
workspace = true
features = ["sp-core", "sp-io"]

[dev-dependencies]
hex = { version = "0.4.3", features = ["std"] }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "ismp/std",
    "alloy-primitives/std",
    "alloy-rlp/std",
    "primitive-types/std",
    "ethabi/std",
    "json/std",
    "thiserror/std",
    "polkadot-sdk/std",
]
