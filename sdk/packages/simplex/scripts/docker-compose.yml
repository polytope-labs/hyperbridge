# Runs the same on Linux, macOS and Windows (PowerShell or WSL2) — `docker compose up -d`.
# The simplex image is a multi-arch manifest, so amd64 and arm64 hosts both pull a native
# image. Nothing here uses host networking, which Docker Desktop does not provide.
#
# With no config in the volume, the simplex service serves the setup wizard at
# http://localhost:8686 and starts filling once it is saved. `run --rm -it simplex init -o
# /data/filler-config.toml` is the same flow in the terminal.
services:
    simplex:
        image: polytopelabs/simplex:latest
        build:
            context: ../../..
            dockerfile: packages/simplex/scripts/Dockerfile
        container_name: hyperbridge-simplex
        restart: unless-stopped
        # No command override: the image's default discovers /data/filler-config.toml and
        # falls back to the setup wizard when there isn't one yet.
        ports:
            # Loopback-only publishing: the UI is unauthenticated and the wizard handles
            # private keys, so it stays on this machine.
            - "127.0.0.1:${SIMPLEX_UI_PORT:-8686}:8686" # web UI / setup wizard
            - "127.0.0.1:${SIMPLEX_METRICS_PORT:-9090}:9090" # prometheus metrics
        volumes:
            # Holds filler-config.toml, the bids database and runtime state. A named volume
            # works the same on every host OS; a bind mount would inherit that OS's file
            # ownership rules, which differ between Linux and Docker Desktop.
            - simplex-data:/data
            # Already have a config on the host? Mount it over the volume instead:
            # - ../filler-config.toml:/data/filler-config.toml:ro
        environment:
            - NODE_ENV=production
        networks:
            - simplex-network
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    prometheus:
        image: prom/prometheus:latest
        container_name: simplex-prometheus
        restart: unless-stopped
        volumes:
            - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus-data:/prometheus
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=30d"
            - "--web.enable-admin-api"
        networks:
            - simplex-network
        ports:
            - "${PROMETHEUS_PORT:-9091}:9090"

    grafana:
        image: grafana/grafana:latest
        container_name: simplex-grafana
        restart: unless-stopped
        volumes:
            - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
            - grafana-data:/var/lib/grafana
        environment:
            - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
            - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
            - GF_USERS_ALLOW_SIGN_UP=false
        networks:
            - simplex-network
        ports:
            - "${GRAFANA_PORT:-3420}:3000"

volumes:
    simplex-data:
    prometheus-data:
    grafana-data:

networks:
    simplex-network:
        driver: bridge
