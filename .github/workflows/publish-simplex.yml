name: "Publish @hyperbridge/simplex"

on:
    push:
        tags:
            - "simplex-v[0-9]+.[0-9]+.[0-9]+"

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: true

env:
    DOCKERHUB_IMAGE: polytopelabs/simplex
    GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/simplex

jobs:
    # One job per architecture, each on a runner of that architecture — a QEMU-emulated
    # arm64 build of this image (pnpm install + tsup + vite + a native sqlite module) is
    # an order of magnitude slower than a native one. Each job pushes an untagged,
    # single-platform image by digest; `merge` stitches the digests into one manifest list
    # per tag, so `docker pull polytopelabs/simplex` resolves natively on Intel and on
    # Apple Silicon / Windows-on-ARM alike.
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-latest
                    - platform: linux/arm64
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout sources
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  # packages/simplex/proto/mpcvaultapis — the image's protoc codegen step
                  # reads it out of the build context, and .git is not in the context.
                  submodules: recursive

            - name: Prepare
              run: |
                  echo "VERSION=${GITHUB_REF#refs/tags/simplex-v}" >> $GITHUB_ENV
                  echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
              env:
                  platform: ${{ matrix.platform }}

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: sdk
                  file: sdk/packages/simplex/scripts/Dockerfile
                  platforms: ${{ matrix.platform }}
                  # Identical content in both registries yields one digest, so `merge` can
                  # reuse it for either manifest list.
                  outputs: type=image,"name=${{ env.DOCKERHUB_IMAGE }},${{ env.GHCR_IMAGE }}",push-by-digest=true,push=true
                  cache-from: type=gha,scope=simplex-${{ matrix.platform }}
                  cache-to: type=gha,mode=max,scope=simplex-${{ matrix.platform }}

            - name: Export digest
              run: |
                  mkdir -p /tmp/digests
                  touch "/tmp/digests/${DIGEST#sha256:}"
              env:
                  DIGEST: ${{ steps.build.outputs.digest }}

            - name: Upload digest
              uses: actions/upload-artifact@v4
              with:
                  name: digests-${{ env.PLATFORM_PAIR }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge:
        runs-on: ubuntu-latest
        needs: build
        permissions:
            contents: read
            packages: write
        steps:
            - name: Download digests
              uses: actions/download-artifact@v4
              with:
                  path: /tmp/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Extract version from tag
              run: echo "VERSION=${GITHUB_REF#refs/tags/simplex-v}" >> $GITHUB_ENV

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Create manifest lists and push
              working-directory: /tmp/digests
              run: |
                  for image in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
                    docker buildx imagetools create \
                      -t "${image}:v${VERSION}" \
                      -t "${image}:latest" \
                      $(printf "${image}@sha256:%s " *)
                  done

            - name: Inspect manifest
              run: docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:v${VERSION}"

    generate-changelog:
        runs-on: ubuntu-latest
        needs: merge
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Get previous tag
              id: previous-tag
              run: |
                  CURRENT_TAG=${GITHUB_REF#refs/tags/}
                  PREVIOUS_TAG=$(git tag -l "simplex-v*" --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -n1)
                  echo "previous_tag=${PREVIOUS_TAG}" >> $GITHUB_OUTPUT
                  echo "current_tag=${CURRENT_TAG}" >> $GITHUB_OUTPUT
                  echo "clean_tag=${CURRENT_TAG#simplex-}" >> $GITHUB_OUTPUT

            - name: Generate changelog
              id: changelog
              run: |
                  CURRENT_TAG=${{ steps.previous-tag.outputs.current_tag }}
                  PREVIOUS_TAG=${{ steps.previous-tag.outputs.previous_tag }}

                  echo "Generating changelog for ${CURRENT_TAG}"
                  echo "Previous tag: ${PREVIOUS_TAG}"

                  if [ -z "$PREVIOUS_TAG" ]; then
                    COMMIT_RANGE="HEAD"
                  else
                    COMMIT_RANGE="${PREVIOUS_TAG}..${CURRENT_TAG}"
                  fi

                  CHANGELOG=$(git log --pretty=format:"* %s (%h)" $COMMIT_RANGE --reverse | grep -i "simplex")

                  echo "changelog<<EOF" >> $GITHUB_OUTPUT
                  echo "## What's Changed" >> $GITHUB_OUTPUT
                  echo "" >> $GITHUB_OUTPUT
                  echo "$CHANGELOG" >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Create GitHub Release
              uses: actions/create-release@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: ${{ steps.previous-tag.outputs.current_tag }}
                  release_name: "@hyperbridge/simplex ${{ steps.previous-tag.outputs.clean_tag }}"
                  body: ${{ steps.changelog.outputs.changelog }}
                  draft: false
                  prerelease: false
