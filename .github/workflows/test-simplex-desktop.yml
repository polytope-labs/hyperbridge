name: "@hyperbridge/simplex-desktop"

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
    push:
        branches: [main]
        paths:
            - "sdk/packages/sdk/**"
            - "sdk/packages/simplex/**"
            - "sdk/packages/simplex-desktop/**"
            - "sdk/package.json"
            - "sdk/pnpm-lock.yaml"
            - "sdk/pnpm-workspace.yaml"
            - ".github/workflows/test-simplex-desktop.yml"
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened, ready_for_review]
        paths:
            - "sdk/packages/sdk/**"
            - "sdk/packages/simplex/**"
            - "sdk/packages/simplex-desktop/**"
            - "sdk/package.json"
            - "sdk/pnpm-lock.yaml"
            - "sdk/pnpm-workspace.yaml"
            - ".github/workflows/test-simplex-desktop.yml"
    workflow_dispatch:

jobs:
    desktop-runtime-integrity:
        name: Desktop Node runtime (${{ matrix.target }})
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-15
                      target: darwin-universal
                    - runner: ubuntu-latest
                      target: linux-x64
                    - runner: ubuntu-24.04-arm
                      target: linux-arm64
                    - runner: windows-latest
                      target: win32-x64
        defaults:
            run:
                working-directory: sdk
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11

            # The staging script needs openpgp and tar, but not Electron's downloaded
            # application binary. The binary under test is fetched from nodejs.org.
            - name: Install staging dependencies
              run: pnpm install --frozen-lockfile --filter="@hyperbridge/simplex-desktop..." --ignore-scripts

            - name: Verify and stage Node
              run: pnpm --dir packages/simplex-desktop stage:node -- --target ${{ matrix.target }}

            - name: Execute staged Node on Unix
              if: runner.os != 'Windows'
              run: test "$(packages/simplex-desktop/resources/node/${{ matrix.target }}/node --version)" = "v24.19.0"

            - name: Execute staged Node on Windows
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $version = & "packages/simplex-desktop/resources/node/win32-x64/node.exe" --version
                  if ($version -ne "v24.19.0") { throw "Expected v24.19.0, got $version" }

    desktop-e2e-artifacts:
        name: Build Simplex desktop E2E artifacts
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: sdk
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  # The PR's merge commit, so a branch that predates this package still tests it.
                  ref: ${{ github.sha }}
                  submodules: recursive

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11

            - name: Install desktop workspace dependencies
              run: pnpm install --frozen-lockfile --filter="@hyperbridge/simplex-desktop..."

            # Build once on Linux: the output is JavaScript and the generated proto
            # sources are portable. Each OS job below still stages and executes its
            # own verified Node runtime and downloads its native Electron binary.
            - name: Build SDK, Simplex, and Electron main process
              run: |
                  pnpm --filter="@hyperbridge/sdk" build
                  pnpm --filter="@hyperbridge/simplex" build
                  pnpm --dir packages/simplex-desktop build
              env:
                  CI: "true"

            - name: Check Simplex desktop
              run: |
                  pnpm --dir packages/simplex-desktop typecheck
                  pnpm --dir packages/simplex-desktop lint
                  pnpm --dir packages/simplex-desktop test

            - name: Upload desktop E2E artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: simplex-desktop-e2e
                  path: |
                      sdk/packages/sdk/dist
                      sdk/packages/simplex/dist
                      sdk/packages/simplex/src/proto
                      sdk/packages/simplex-desktop/dist
                  if-no-files-found: error
                  retention-days: 1

    desktop-electron-e2e:
        name: Desktop Electron E2E (${{ matrix.target }})
        needs: desktop-e2e-artifacts
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-15
                      target: darwin-arm64
                    - runner: ubuntu-latest
                      target: linux-x64
                    - runner: ubuntu-24.04-arm
                      target: linux-arm64
                    - runner: windows-latest
                      target: win32-x64
        defaults:
            run:
                working-directory: sdk
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  # The PR's merge commit, so a branch that predates this package still tests it.
                  ref: ${{ github.sha }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11

            - name: Install desktop workspace dependencies
              run: pnpm install --frozen-lockfile --filter="@hyperbridge/simplex-desktop..."

            - name: Download built desktop artifacts
              uses: actions/download-artifact@v4
              with:
                  name: simplex-desktop-e2e
                  path: sdk/packages

            - name: Install Linux display and listener tools
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y lsof xvfb

            - name: Verify and stage the host Node runtime
              run: pnpm --dir packages/simplex-desktop stage:node -- --target ${{ matrix.target }}

            - name: Run cross-platform desktop tests
              run: pnpm --dir packages/simplex-desktop test

            - name: Run Electron E2E on Linux
              if: runner.os == 'Linux'
              run: xvfb-run -a pnpm --dir packages/simplex-desktop test:e2e

            - name: Run Electron E2E on macOS and Windows
              if: runner.os != 'Linux'
              run: pnpm --dir packages/simplex-desktop test:e2e
